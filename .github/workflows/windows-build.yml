name: Windows x64 build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies with retry
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npm ci
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -eq 3) { exit $LASTEXITCODE }
            Write-Host "Dependency installation failed; retrying in 15 seconds (attempt $attempt of 3)."
            Remove-Item -Force -Recurse node_modules -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 15
          }
      - name: Build portable Windows x64 executable
        run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: Windows12-Prism-x64
          path: release/*.exe
