<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101c49"/>
      <stop offset="0.55" stop-color="#35236d"/>
      <stop offset="1" stop-color="#0a1025"/>
    </linearGradient>
    <linearGradient id="prism" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.38" stop-color="#e2d2ff"/>
      <stop offset="1" stop-color="#8ae7ff"/>
    </linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="390" cy="105" r="120" fill="#9b84ff" opacity=".21" filter="url(#glow)"/>
  <circle cx="104" cy="430" r="140" fill="#54dfff" opacity=".12" filter="url(#glow)"/>
  <g transform="translate(118 118) skewY(-4)" fill="url(#prism)" filter="url(#glow)">
    <rect x="0" y="0" width="126" height="126" rx="28"/>
    <rect x="150" y="0" width="126" height="126" rx="28" opacity=".72"/>
    <rect x="0" y="150" width="126" height="126" rx="28" opacity=".54"/>
    <rect x="150" y="150" width="126" height="126" rx="28" opacity=".34"/>
  </g>
  <rect x="20" y="20" width="472" height="472" rx="94" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="4"/>
</svg>
